services:

  postgres:
    image: postgres:17
    container_name: ai-engineering-postgres
    environment:
      POSTGRES_DB: ai_engineering_copilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_engineering_copilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: ai-engineering-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ai_engineering_copilot
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SERVER_PORT: 8080
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: ai-engineering-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data: