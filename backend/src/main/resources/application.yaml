spring:
  application:
    name: ai-knowledge-copilot

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5437/ai_engineering_copilot}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always